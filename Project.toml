# CMBForegrounds is not registered in the General registry. On Julia 1.11+ the
# [sources] section below resolves it recursively from the pinned v0.4.0 tag, so
# `Pkg.add(url=...)` of this package works without further steps. Julia 1.10 does
# not support [sources] and needs the explicit bootstrap documented in README.md
# and performed by .github/workflows/CI.yml.
[sources]
CMBForegrounds = {url = "https://github.com/JuliaCosmologicalLikelihoods/CMBForegrounds.jl", rev = "v0.4.0"}

